# wrangler.toml — SPLAT lobby server (Phase 1).
# Free tier only: one Durable Object, no KV / R2 / queues / paid bindings.
# Deploy later with:  npx wrangler deploy   (from worker/)
# Run locally with:   npx wrangler dev     (http://localhost:8787)
# NOTE: the Worker is NOT deployed yet. The live base URL does not exist
# until someone runs `wrangler deploy` and records the workers.dev URL.

name = "splat-lobby"
main = "src/index.js"
compatibility_date = "2026-11-13"
workers_dev = true

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyRoom"]
